name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Sample repository tests (the code IncidentForge is allowed to patch)
        run: for repo in sample-repo/*/; do mvn -B --no-transfer-progress -f "$repo/pom.xml" test; done
      - name: Build and test IncidentForge (offline model, embedded Kafka, real Maven validation)
        run: mvn -B --no-transfer-progress verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
