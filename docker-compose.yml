# Single-node Kafka (KRaft) for running IncidentForge with incidentforge.bus=kafka (the default profile).
#   docker compose up -d kafka
#   export INCIDENTFORGE_REPORTER_PASSWORD=... INCIDENTFORGE_REVIEWER_PASSWORD=... INCIDENTFORGE_MCP_PASSWORD=...
#   java -jar target/incidentforge-agent.jar
# or run both in containers (same env vars required): docker compose --profile app up --build
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: incidentforge-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  app:
    profiles: ["app"]
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:h2:mem:incidentforge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
      INCIDENTFORGE_REPORTER_PASSWORD: ${INCIDENTFORGE_REPORTER_PASSWORD}
      INCIDENTFORGE_REVIEWER_PASSWORD: ${INCIDENTFORGE_REVIEWER_PASSWORD}
      INCIDENTFORGE_MCP_PASSWORD: ${INCIDENTFORGE_MCP_PASSWORD}
